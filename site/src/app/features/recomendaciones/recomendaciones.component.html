<h2>Recomendaciones</h2>

<div class="grid">
  <!-- HISTÓRICO -->
  <mat-card class="left">
    <mat-card-title>Histórico</mat-card-title>

    <table mat-table [dataSource]="recs" class="mat-elevation-z2 full">
      <!-- Fecha -->
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha }}</td>
      </ng-container>

      <!-- Mensaje -->
      <ng-container matColumnDef="mensaje">
        <th mat-header-cell *matHeaderCellDef>Mensaje</th>
        <td mat-cell *matCellDef="let r">{{ r.mensaje }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card>

  <!-- NUEVA RECOMENDACIÓN -->
  <mat-card class="right">
    <mat-card-title>Nueva recomendación</mat-card-title>

    <form (ngSubmit)="handleSubmit()">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Mensaje</mat-label>
        <textarea matInput rows="3" [(ngModel)]="texto" name="texto"></textarea>
      </mat-form-field>

      <button mat-raised-button color="primary">Guardar</button>
    </form>
  </mat-card>
</div>
